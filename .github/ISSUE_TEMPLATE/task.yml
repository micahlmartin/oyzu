name: Implementation task
description: Track bounded implementation work.
title: "[Task]: "
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope and related design
      description: Link the tracking issue and accepted design where applicable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Reference OEP acceptance IDs and EX example IDs; define observable outcomes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Include relevant platforms and failure cases.
