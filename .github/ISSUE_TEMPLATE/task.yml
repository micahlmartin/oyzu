name: Implementation task
description: Track bounded implementation work.
title: "[Task]: "
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope and related design
      description: Identify the owning subsystem and relevant interface, link the design where applicable, and describe the bounded work an AI coding agent should implement.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Reference OEP acceptance IDs and EX example IDs; define observable outcomes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Include relevant platforms and failure cases.
