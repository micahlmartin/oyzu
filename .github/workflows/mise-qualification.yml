name: Mise qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/mise-qualification]
    paths:
      - 'tooling/mise-experiment/**'
      - '.github/workflows/mise-qualification.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  native-macos:
    name: Native macOS mise library and shell qualification
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned experiment compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/mise-target
          key: mise-da0db43-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/mise-experiment/embedding.patch', 'tooling/mise-experiment/spike.rs') }}
          restore-keys: mise-da0db43-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare pinned source and preserve notices
        run: python3 tooling/mise-experiment/prepare.py --source "$RUNNER_TEMP/mise-source" --patch
      - name: Compile linked frontend only
        working-directory: ${{ runner.temp }}/mise-source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mise-target
        run: cargo +1.95.0 build --locked --example oyzu-mise-spike --no-default-features --features rustls,vfox/vendored-lua
      - name: Provision verified real Node archives
        run: python3 tooling/mise-experiment/run.py --work "$RUNNER_TEMP/mise-fixtures" --provision
      - name: Run native shell, exec, backend and lock cases
        run: python3 tooling/mise-experiment/run.py --work "$RUNNER_TEMP/mise-fixtures" --binary "$RUNNER_TEMP/mise-target/debug/examples/oyzu-mise-spike"
      - name: Retain runtime evidence even after a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mise-native-macos-evidence
          path: |
            ${{ runner.temp }}/mise-fixtures/run-*/results.json
            ${{ runner.temp }}/mise-fixtures/archives/inventory-*.json
          if-no-files-found: warn
