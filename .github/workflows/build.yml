name: CLI and scenarios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust compiler for CI
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and discovery integration tests
        run: cargo test --locked
      - name: Compile release CLI
        run: cargo build --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: |
            target/release/oyzu
            target/release/oyzu.exe
          if-no-files-found: error

  task-scenarios:
    name: Compiled CLI task scenarios (${{ matrix.os }})
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: cli
      - name: Execute compiled CLI against real task scenarios
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tooling/test-task-scenarios.py --cli cli/oyzu.exe
          else
            chmod +x cli/oyzu
            python3 tooling/test-task-scenarios.py --cli cli/oyzu
          fi

  build-scenarios:
    name: Compiled CLI captured-source builds (Linux)
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-ubuntu-latest
          path: cli
      - name: Provision native toolchain images and contract validator
        run: |
          docker pull node:22-bookworm-slim
          docker pull golang:1.24-bookworm
          docker pull python:3.12-slim-bookworm
          docker pull ghcr.io/astral-sh/uv:0.12.21-python3.12-trixie-slim
          docker build --tag oyzu-toolchain/poetry:2.5.1-python3.12 --file tooling/images/python-poetry.Dockerfile tooling/images
          python3 -m pip install -r tooling/design-requirements.txt
      - name: Build and verify native snapshot artifacts through the compiled CLI
        run: |
          chmod +x cli/oyzu
          python3 tooling/test-python-adapter.py
          python3 tooling/test-build-scenarios.py --cli cli/oyzu
