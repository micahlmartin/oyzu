name: CLI and scenarios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust compiler for CI
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Restore CLI compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and discovery integration tests
        run: cargo test --locked
      - name: Native policy integrity store
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test --locked config::policy_runtime::tests::native_integrity_store_roundtrip -- --ignored --exact
      - name: Provision Linux policy integrity store fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus gnome-keyring
          mkdir -p "$RUNNER_TEMP/oyzu-keyring-data" "$RUNNER_TEMP/oyzu-keyring-runtime"
          chmod 700 "$RUNNER_TEMP/oyzu-keyring-data" "$RUNNER_TEMP/oyzu-keyring-runtime"
      - name: Native Linux policy integrity store
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/oyzu-keyring-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/oyzu-keyring-runtime
        run: |
          dbus-run-session -- bash -euc '
            printf %s oyzu-disposable-ci-keyring | gnome-keyring-daemon --daemonize --unlock --components=secrets
            cargo test --locked config::policy_runtime::tests::native_integrity_store_roundtrip -- --ignored --exact
          '
      - name: Compile release CLI
        run: cargo build --locked --release
      - name: Native Cargo artifact message contract
        run: python tooling/test-rust-artifacts.py
      - name: Native Cargo doctest conformance
        run: python tooling/test-rust-doctests.py
      - name: Native Cargo mixed workspace packaging
        run: python tooling/test-rust-packaging.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: |
            target/release/oyzu
            target/release/oyzu.exe
          if-no-files-found: error

  task-scenarios:
    name: Compiled CLI task scenarios (${{ matrix.os }})
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: cli
      - name: Native Go module archive consumption
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ADAPTER="$GITHUB_WORKSPACE/.ci-go-modulezip.exe"; else ADAPTER="$GITHUB_WORKSPACE/.ci-go-modulezip"; fi
          cd src/builders/go/runtime/modulezip
          go mod download
          go mod verify
          test -z "$(gofmt -l . ../metadata.go)"
          go vet ./...
          go build -mod=readonly -trimpath -o "$ADAPTER" .
          cd "$GITHUB_WORKSPACE"
          python tooling/test-go-modulezip.py --adapter "$ADAPTER"
      - name: Native Rust direct test bundles
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: '1.94.0'
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component llvm-tools-preview
          python tooling/provision-rust-reporting.py --destination .ci-rust-reporting
          python -m pip install -r tooling/design-requirements.txt
          export PATH="$GITHUB_WORKSPACE/.ci-rust-reporting:$PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=cli/oyzu.exe; else CLI=cli/oyzu; chmod +x "$CLI"; fi
          python tooling/test-rust-direct.py --cli "$CLI"
      - name: Native Docker metadata and OCI image inputs
        shell: bash
        run: |
          for adapter in src/builders/docker/runtime/metadata src/dependencies/runtime/images; do
            cd "$GITHUB_WORKSPACE/$adapter"
            go mod download
            go mod verify
            test -z "$(gofmt -l .)"
            go vet ./...
            GOPROXY=off GOSUMDB=off go test -mod=readonly ./...
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native Java quality tasks
        shell: bash
        run: |
          python tooling/test-provisioning.py
          python tooling/provision-java-quality.py --destination .ci-java-quality
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=cli/oyzu.exe; else CLI=cli/oyzu; chmod +x "$CLI"; fi
          python tooling/test-java-quality.py --cli "$CLI" --tools .ci-java-quality
      - name: Native Ant direct test bundles
        shell: bash
        run: |
          python tooling/provision-ant-reporting.py --destination .ci-ant-reporting
          python -m pip install -r tooling/design-requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=cli/oyzu.exe; else CLI=cli/oyzu; chmod +x "$CLI"; fi
          python tooling/test-ant-direct.py --cli "$CLI" --tools .ci-ant-reporting
      - name: Native Dockerfile quality tasks
        shell: bash
        run: |
          python tooling/provision-hadolint.py --destination .ci-docker-quality
          if [ "$RUNNER_OS" = "Windows" ]; then
            FORMATTER="$GITHUB_WORKSPACE/.ci-docker-quality/dockerfmt.exe"
            CLI=cli/oyzu.exe
          else
            FORMATTER="$GITHUB_WORKSPACE/.ci-docker-quality/dockerfmt"
            CLI=cli/oyzu
            chmod +x "$CLI"
          fi
          cd tooling/images/docker-quality
          go mod download
          go mod verify
          CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go build -mod=readonly -trimpath -o "$FORMATTER" github.com/reteps/dockerfmt
          cd "$GITHUB_WORKSPACE"
          python tooling/test-docker-quality.py --cli "$CLI" --tools .ci-docker-quality
      - name: Native Helm YAML quality tasks
        shell: bash
        run: |
          python tooling/provision-yamlfmt.py --destination .ci-helm-quality
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI=cli/oyzu.exe
            FORMATTER=.ci-helm-quality/yamlfmt.exe
          else
            CLI=cli/oyzu
            FORMATTER=.ci-helm-quality/yamlfmt
            chmod +x "$CLI"
          fi
          python tooling/test-helm-quality.py --cli "$CLI" --yamlfmt "$FORMATTER"
      - name: Native Python test discovery and reporting
        shell: bash
        run: |
          python -m venv .ci-task-python
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.ci-task-python/Scripts/python.exe
            CLI=cli/oyzu.exe
          else
            PYTHON=.ci-task-python/bin/python
            CLI=cli/oyzu
            chmod +x "$CLI"
          fi
          "$PYTHON" -m pip install pytest==8.3.5 pytest-cov==6.0.0 coverage==7.16.2 uv==0.12.21 poetry==2.5.1 -r tooling/design-requirements.txt
          "$PYTHON" tooling/test-python-tasks.py --cli "$CLI"
          "$PYTHON" tooling/test-python-reporting.py
          "$PYTHON" tooling/test-python-direct.py --cli "$CLI"
          "$PYTHON" tooling/test-direct-test-bundles.py --cli "$CLI"
          "$PYTHON" tooling/test-go-direct.py --cli "$CLI"
      - name: Execute compiled CLI against real task scenarios
        shell: bash
        run: |
          node --test tooling/test-node-lock.mjs
          node --test tooling/test-jest-results.mjs
          python tooling/test-node-acquisition.py
          python tooling/test-npm-workspaces.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-quality
          python tooling/test-npm-workspace-build.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-pnpm
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-yarn
          python tooling/test-node-managers.py --pnpm-cli tooling/images/node-pnpm/node_modules/pnpm/bin/pnpm.cjs --yarn-cli tooling/images/node-yarn/node_modules/yarn/bin/yarn.js --tar-stream tooling/images/node-yarn/node_modules/tar-stream
          python tooling/test-node-archive.py --tar-stream tooling/images/node-yarn/node_modules/tar-stream
          python tooling/test-node-runtime.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/fixtures/jest
          python tooling/test-jest-reporting.py --jest-cli tooling/fixtures/jest/node_modules/jest/bin/jest.js
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/fixtures/vitest
          python tooling/test-vitest-reporting.py --node-modules tooling/fixtures/vitest/node_modules
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/fixtures/mocha
          if [ "$RUNNER_OS" = "Windows" ]; then FRAMEWORK_CLI=cli/oyzu.exe; else FRAMEWORK_CLI=cli/oyzu; fi
          python -m pip install -r tooling/design-requirements.txt
          python tooling/test-node-framework-direct.py --cli "$FRAMEWORK_CLI"
          python tooling/test-npm-workspace-direct.py --cli "$FRAMEWORK_CLI"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tooling/test-go-metadata.py --cli cli/oyzu.exe
            python tooling/test-task-scenarios.py --cli cli/oyzu.exe
            python tooling/test-npm-workspace-tasks.py --cli cli/oyzu.exe
            python tooling/test-npm-workspace-tests.py --cli cli/oyzu.exe
            python tooling/test-node-quality.py --cli cli/oyzu.exe
            python tooling/test-biome-quality.py --cli cli/oyzu.exe
            python tooling/test-node-application.py --cli cli/oyzu.exe
            python tooling/test-node-conventional-application.py --cli cli/oyzu.exe
            python tooling/test-mocha-reporting.py --cli cli/oyzu.exe
          else
            chmod +x cli/oyzu
            python3 tooling/test-go-metadata.py --cli cli/oyzu
            python3 tooling/test-task-scenarios.py --cli cli/oyzu
            python3 tooling/test-npm-workspace-tasks.py --cli cli/oyzu
            python3 tooling/test-npm-workspace-tests.py --cli cli/oyzu
            python3 tooling/test-node-quality.py --cli cli/oyzu
            python3 tooling/test-biome-quality.py --cli cli/oyzu
            python3 tooling/test-node-application.py --cli cli/oyzu
            python3 tooling/test-node-conventional-application.py --cli cli/oyzu
            python3 tooling/test-mocha-reporting.py --cli cli/oyzu
          fi

  container-worker-contract:
    name: Native isolated BuildKit worker contract (Linux)
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-ubuntu-latest
          path: cli
      - name: Provision native worker and probe compiler
        run: |
          docker pull moby/buildkit:v0.25.0-rootless
          docker pull alpine:3.22
          docker tag alpine:3.22 oyzu-fixture/alpine:amd64
          docker pull golang:1.24-bookworm
      - name: Compile and test native Dockerfile metadata adapter
        run: docker build -f tooling/images/docker-metadata.Dockerfile -t oyzu-toolchain/docker:buildkit0.25.0 .
      - name: Provision explicit worker user-namespace profile
        run: sudo apparmor_parser -r tooling/images/buildkit.apparmor
      - name: Verify generated recipe through the native Rust executor
        env:
          OYZU_TEST_RECIPE_APPARMOR_PROFILE: oyzu-buildkit
          OYZU_RECIPE_EVIDENCE_DIR: worker-recipe-evidence
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 test --locked --lib executor::worker::native_recipe::generated_recipe_builds_reproducible_native_oci_without_a_source_dockerfile -- --ignored --exact
          cargo +1.94.0 test --locked --lib dependencies::images::native::captured_base_feeds_generated_assembly_without_source_dockerfile -- --ignored --exact
          cargo +1.94.0 test --locked --lib executor::worker::native_dependencies::named_dependency_context_is_exact_readonly_offline_and_reproducible -- --ignored --exact
      - name: Verify native worker isolation and reproducible OCI export
        run: |
          chmod +x cli/oyzu
          python3 tooling/test-buildkit-worker.py --evidence-dir worker-evidence --apparmor-profile oyzu-buildkit --cli cli/oyzu
      - name: Retain worker logs and native OCI outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-worker-evidence
          path: |
            worker-evidence
            worker-recipe-evidence
          if-no-files-found: ignore
          retention-days: 14

  build-scenarios:
    name: Captured builds (${{ matrix.suite }}, Linux)
    needs: build-cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [core, dependencies, node, python, go, rust, java, helm, docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.suite == 'node' || matrix.suite == 'core' || matrix.suite == 'docker' || matrix.suite == 'dependencies'
        with:
          node-version: '22'
      - name: Provision JDK for native adapter verification
        if: matrix.suite == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-ubuntu-latest
          path: cli
      - name: Provision ARM emulation for platform acceptance
        if: matrix.suite == 'docker'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Provision suite toolchains and contract validator
        id: provision
        run: bash tooling/build-scenario-tools.sh provision "${{ matrix.suite }}"
      - name: Check acceptance suite inventory
        id: inventory
        run: .ci-python/bin/python tooling/check-build-suites.py
      - name: Native adapter conformance
        run: |
          chmod +x cli/oyzu
          bash tooling/build-scenario-tools.sh native "${{ matrix.suite }}"
      - name: Build and verify native snapshot artifacts through the compiled CLI
        # Preserve native conformance failures, but still gather the independent
        # end-to-end result when its tools and inventory were prepared correctly.
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && steps.inventory.outcome == 'success' }}
        env:
          OYZU_BUILDKIT_APPARMOR_PROFILE: oyzu-buildkit
        run: .ci-python/bin/python tooling/test-build-scenarios.py --suite "${{ matrix.suite }}" --cli cli/oyzu --evidence-dir build-evidence
      - name: Retain native snapshot artifacts and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-build-evidence-${{ matrix.suite }}
          path: build-evidence
          if-no-files-found: ignore
          retention-days: 14

  build-scenarios-complete:
    name: Captured build suite acceptance
    if: always()
    needs: build-scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Require every implemented suite to pass
        env:
          SUITE_RESULT: ${{ needs.build-scenarios.result }}
        run: test "$SUITE_RESULT" = success
