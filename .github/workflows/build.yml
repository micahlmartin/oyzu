name: CLI and scenarios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust compiler for CI
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Restore CLI compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and discovery integration tests
        run: cargo test --locked
      - name: Native policy integrity store
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test --locked config::policy_runtime::tests::native_integrity_store_roundtrip -- --ignored --exact
      - name: Provision Linux policy integrity store fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus gnome-keyring
          mkdir -p "$RUNNER_TEMP/oyzu-keyring-data" "$RUNNER_TEMP/oyzu-keyring-runtime"
          chmod 700 "$RUNNER_TEMP/oyzu-keyring-data" "$RUNNER_TEMP/oyzu-keyring-runtime"
      - name: Native Linux policy integrity store
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/oyzu-keyring-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/oyzu-keyring-runtime
        run: |
          dbus-run-session -- bash -euc '
            printf %s oyzu-disposable-ci-keyring | gnome-keyring-daemon --daemonize --unlock --components=secrets
            cargo test --locked config::policy_runtime::tests::native_integrity_store_roundtrip -- --ignored --exact
          '
      - name: Compile release CLI
        run: cargo build --locked --release
      - name: Native Cargo artifact message contract
        run: python tooling/test-rust-artifacts.py
      - name: Native Cargo doctest conformance
        run: python tooling/test-rust-doctests.py
      - name: Native Cargo mixed workspace packaging
        run: python tooling/test-rust-packaging.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: |
            target/release/oyzu
            target/release/oyzu.exe
          if-no-files-found: error

  task-scenarios:
    name: Compiled CLI task scenarios (${{ matrix.os }})
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-${{ matrix.os }}
          path: cli
      - name: Native Go module archive consumption
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ADAPTER="$GITHUB_WORKSPACE/.ci-go-modulezip.exe"; else ADAPTER="$GITHUB_WORKSPACE/.ci-go-modulezip"; fi
          cd src/builders/go/runtime/modulezip
          go mod download
          go mod verify
          test -z "$(gofmt -l . ../metadata.go)"
          go vet ./...
          go build -mod=readonly -trimpath -o "$ADAPTER" .
          cd "$GITHUB_WORKSPACE"
          python tooling/test-go-modulezip.py --adapter "$ADAPTER"
      - name: Native Docker metadata and OCI image inputs
        shell: bash
        run: |
          for adapter in metadata images; do
            cd "$GITHUB_WORKSPACE/src/builders/docker/runtime/$adapter"
            go mod download
            go mod verify
            test -z "$(gofmt -l .)"
            go vet ./...
            GOPROXY=off GOSUMDB=off go test -mod=readonly ./...
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native Java quality tasks
        shell: bash
        run: |
          python tooling/provision-java-quality.py --destination .ci-java-quality
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=cli/oyzu.exe; else CLI=cli/oyzu; chmod +x "$CLI"; fi
          python tooling/test-java-quality.py --cli "$CLI" --tools .ci-java-quality
      - name: Native Dockerfile quality tasks
        shell: bash
        run: |
          python tooling/provision-hadolint.py --destination .ci-docker-quality
          if [ "$RUNNER_OS" = "Windows" ]; then
            FORMATTER="$GITHUB_WORKSPACE/.ci-docker-quality/dockerfmt.exe"
            CLI=cli/oyzu.exe
          else
            FORMATTER="$GITHUB_WORKSPACE/.ci-docker-quality/dockerfmt"
            CLI=cli/oyzu
            chmod +x "$CLI"
          fi
          cd tooling/images/docker-quality
          go mod download
          go mod verify
          CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go build -mod=readonly -trimpath -o "$FORMATTER" github.com/reteps/dockerfmt
          cd "$GITHUB_WORKSPACE"
          python tooling/test-docker-quality.py --cli "$CLI" --tools .ci-docker-quality
      - name: Native Python test discovery and reporting
        shell: bash
        run: |
          python -m venv .ci-task-python
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.ci-task-python/Scripts/python.exe
            CLI=cli/oyzu.exe
          else
            PYTHON=.ci-task-python/bin/python
            CLI=cli/oyzu
            chmod +x "$CLI"
          fi
          "$PYTHON" -m pip install pytest==8.3.5 pytest-cov==6.0.0 coverage==7.16.2
          "$PYTHON" tooling/test-python-tasks.py --cli "$CLI"
          "$PYTHON" tooling/test-python-reporting.py
      - name: Execute compiled CLI against real task scenarios
        shell: bash
        run: |
          node --test tooling/test-node-lock.mjs
          node --test tooling/test-jest-results.mjs
          python tooling/test-node-acquisition.py
          python tooling/test-npm-workspaces.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-quality
          python tooling/test-npm-workspace-build.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-pnpm
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-yarn
          python tooling/test-node-managers.py --pnpm-cli tooling/images/node-pnpm/node_modules/pnpm/bin/pnpm.cjs --yarn-cli tooling/images/node-yarn/node_modules/yarn/bin/yarn.js --tar-stream tooling/images/node-yarn/node_modules/tar-stream
          python tooling/test-node-archive.py --tar-stream tooling/images/node-yarn/node_modules/tar-stream
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/fixtures/jest
          python tooling/test-jest-reporting.py --jest-cli tooling/fixtures/jest/node_modules/jest/bin/jest.js
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/fixtures/vitest
          python tooling/test-vitest-reporting.py --node-modules tooling/fixtures/vitest/node_modules
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tooling/test-go-metadata.py --cli cli/oyzu.exe
            python tooling/test-task-scenarios.py --cli cli/oyzu.exe
            python tooling/test-npm-workspace-tasks.py --cli cli/oyzu.exe
            python tooling/test-npm-workspace-tests.py --cli cli/oyzu.exe
            python tooling/test-node-quality.py --cli cli/oyzu.exe
            python tooling/test-biome-quality.py --cli cli/oyzu.exe
          else
            chmod +x cli/oyzu
            python3 tooling/test-go-metadata.py --cli cli/oyzu
            python3 tooling/test-task-scenarios.py --cli cli/oyzu
            python3 tooling/test-npm-workspace-tasks.py --cli cli/oyzu
            python3 tooling/test-npm-workspace-tests.py --cli cli/oyzu
            python3 tooling/test-node-quality.py --cli cli/oyzu
            python3 tooling/test-biome-quality.py --cli cli/oyzu
          fi

  container-worker-contract:
    name: Native isolated BuildKit worker contract (Linux)
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-ubuntu-latest
          path: cli
      - name: Provision native worker and probe compiler
        run: |
          docker pull moby/buildkit:v0.25.0-rootless
          docker pull alpine:3.22
          docker pull golang:1.24-bookworm
      - name: Compile and test native Dockerfile metadata adapter
        run: docker build -f tooling/images/docker-metadata.Dockerfile -t oyzu-toolchain/docker:buildkit0.25.0 .
      - name: Provision explicit worker user-namespace profile
        run: sudo apparmor_parser -r tooling/images/buildkit.apparmor
      - name: Verify native worker isolation and reproducible OCI export
        run: |
          chmod +x cli/oyzu
          python3 tooling/test-buildkit-worker.py --evidence-dir worker-evidence --apparmor-profile oyzu-buildkit --cli cli/oyzu
      - name: Retain worker logs and native OCI outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-worker-evidence
          path: worker-evidence
          if-no-files-found: ignore
          retention-days: 14

  build-scenarios:
    name: Compiled CLI captured-source builds (Linux)
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision JDK for native adapter verification
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oyzu-ubuntu-latest
          path: cli
      - name: Provision native toolchain images and contract validator
        run: |
          docker pull node:22-bookworm-slim
          docker pull alpine:3.22
          docker build --tag oyzu-toolchain/node:quality tooling/images/node-quality
          npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/images/node-quality
          docker build --tag oyzu-toolchain/node:npm11.11.0-node22 tooling/images/node-npm
          docker build --tag oyzu-toolchain/node:pnpm10.11.0-node22 tooling/images/node-pnpm
          docker build --tag oyzu-toolchain/node:yarn1.22.22-node22 tooling/images/node-yarn
          docker pull golang:1.24-bookworm
          docker pull python:3.12-slim-bookworm
          docker build --tag oyzu-toolchain/go:1.24-mod0.25.0 --file tooling/images/go.Dockerfile .
          docker pull python:3.12-bookworm
          docker run --rm --mount type=bind,source="$PWD",target=/repository --workdir /repository python:3.12-bookworm python -m pip download --only-binary=:all: --dest .ci-python-legacy-wheels setuptools==80.9.0 wheel==0.45.1 build==1.2.2.post1 packaging==24.2 pytest==8.3.5 pytest-cov==6.0.0 ruff==0.11.13
          docker pull ghcr.io/astral-sh/uv:0.12.21-python3.12-trixie-slim
          docker build --tag oyzu-toolchain/poetry:2.5.1-python3.12 --file tooling/images/python-poetry.Dockerfile tooling/images
          docker build --tag oyzu-toolchain/rust:1.94.0-nextest0.9.146-llvmcov0.9.1 --file tooling/images/rust.Dockerfile tooling/images
          docker build --tag oyzu-toolchain/helm:3.22.0 --file tooling/images/helm.Dockerfile tooling/images
          docker build --tag oyzu-toolchain/ant:1.10.18-jdk17 --file tooling/images/ant.Dockerfile .
          docker build --tag oyzu-toolchain/maven:3.9.11-jdk17 --file tooling/images/maven.Dockerfile .
          docker build --tag oyzu-toolchain/gradle:8.14.3-jdk17 --file tooling/images/gradle.Dockerfile .
          docker build --tag oyzu-toolchain/docker:buildkit0.25.0 --file tooling/images/docker-metadata.Dockerfile .
          sudo apparmor_parser -r tooling/images/buildkit.apparmor
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install -r tooling/design-requirements.txt
          .ci-python/bin/python -m pip install pytest==8.3.5 pytest-cov==6.0.0 coverage==7.16.2
          .ci-python/bin/python -m pip download --only-binary=:all: --dest .ci-python-app-wheels packaging==24.2 pytest==8.3.5 pytest-cov==6.0.0 coverage==7.16.2 ruff==0.11.13 build==1.2.2.post1 setuptools==80.9.0 wheel==0.45.1
          .ci-python/bin/python -m pip download --only-binary=:all: --dest .ci-python-quality-wheels black==25.1.0 flake8==7.3.0 ruff==0.11.13
      - name: Build and verify native snapshot artifacts through the compiled CLI
        env:
          OYZU_BUILDKIT_APPARMOR_PROFILE: oyzu-buildkit
        run: |
          chmod +x cli/oyzu
          .ci-python/bin/python tooling/test-python-adapter.py
          .ci-python/bin/python tooling/test-python-reporting.py
          .ci-python/bin/python tooling/test-python-application.py --wheels .ci-python-app-wheels
          .ci-python/bin/python tooling/test-python-distribution-app.py --wheels .ci-python-app-wheels
          .ci-python/bin/python tooling/test-python-quality.py --wheels .ci-python-quality-wheels
          docker run --rm --network=none --mount type=bind,source="$PWD",target=/repository,readonly --workdir /repository python:3.12-bookworm python tooling/test-python-legacy.py --wheels .ci-python-legacy-wheels
          .ci-python/bin/python tooling/test-helm-archive.py
          docker run --rm --network=none --mount type=bind,source="$PWD",target=/repository,readonly --workdir /repository --entrypoint python oyzu-toolchain/helm:3.22.0 tooling/test-helm-reporting.py
          HELM_CONTAINER=$(docker create oyzu-toolchain/helm:3.22.0)
          trap 'docker rm -f "$HELM_CONTAINER" >/dev/null' EXIT
          mkdir -p .ci-helm .ci-helm-plugins
          docker cp "$HELM_CONTAINER:/usr/local/bin/helm" .ci-helm/helm
          docker cp "$HELM_CONTAINER:/opt/oyzu-helm-plugins/." .ci-helm-plugins/
          docker rm "$HELM_CONTAINER"
          trap - EXIT
          HELM_PLUGINS="$PWD/.ci-helm-plugins" .ci-python/bin/python tooling/test-helm-reporting.py --helm "$PWD/.ci-helm/helm" --cli cli/oyzu
          .ci-python/bin/python tooling/test-ant-adapter.py
          docker run --rm --network=none --mount type=bind,source="$PWD",target=/repository,readonly --workdir /repository --entrypoint python3 oyzu-toolchain/ant:1.10.18-jdk17 tooling/test-ant-reporting.py --java-home /opt/java/openjdk --ant-home /opt/ant --jacoco-home /opt/jacoco
          docker run --rm --network=none --mount type=bind,source="$PWD",target=/repository,readonly --workdir /repository --entrypoint python3 oyzu-toolchain/maven:3.9.11-jdk17 tooling/test-maven-metadata.py --maven-home /opt/maven --java-home /opt/java/openjdk
          docker run --rm --network=none --mount type=bind,source="$PWD",target=/repository,readonly --workdir /repository --entrypoint python3 oyzu-toolchain/gradle:8.14.3-jdk17 tooling/test-gradle-metadata.py --gradle-home /opt/gradle-8.14.3 --java-home /opt/java/openjdk
          .ci-python/bin/python tooling/test-build-scenarios.py --cli cli/oyzu --evidence-dir build-evidence
      - name: Retain native snapshot artifacts and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oyzu-build-evidence
          path: build-evidence
          if-no-files-found: ignore
          retention-days: 14
