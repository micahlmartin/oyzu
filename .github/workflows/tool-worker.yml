name: Tool worker lifecycle

on:
  push:
    branches: [main, codex/mise-qualification]
    paths:
      - 'src/tools/**'
      - 'src/main.rs'
      - 'src/lib.rs'
      - 'src/config/policy.rs'
      - 'tests/fixtures/tool-worker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tool-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker:
    name: Native worker lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned compiler and checks
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Restore native worker compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: worker-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            worker-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native worker contracts and subprocess lifecycle
        timeout-minutes: 10
        run: cargo test --locked --lib tools::worker
