name: Mise upstream observation

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - tooling/mise-upstream/**
      - .github/workflows/mise-upstream.yml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test observation and pin checks
        run: python3 -m unittest discover -s tooling/mise-upstream -p 'test_*.py'
      - name: Observe public upstream and fork revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/mise-upstream/check.py --output upstream-observation.json
      - name: Retain observation (not release approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mise-upstream-observation
          path: upstream-observation.json
          if-no-files-found: error
          retention-days: 90
