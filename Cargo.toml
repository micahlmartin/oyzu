[package]
name = "oyzu"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "An opinionated developer build platform"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
