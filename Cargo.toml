[package]
name = "oyzu"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "An opinionated developer build platform"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
toml = "0.8"
walkdir = "2.5"
globset = "0.4"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json_canonicalizer = "0.3.2"
tempfile = "3.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
