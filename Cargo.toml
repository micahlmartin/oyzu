[package]
name = "oyzu"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "An opinionated developer build platform"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
yaml-rust2 = { version = "0.13", default-features = false }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"
jwt-compact = { version = "0.8", default-features = false, features = ["std", "ed25519-dalek"] }
ed25519-dalek = "2"
walkdir = "2.5"
globset = "0.4"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json_canonicalizer = "0.3.2"
tempfile = "3.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
httpdate = "1.0.3"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
